<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>SECOND CHANCE</h1>
        <p>~A Moment Of Peace For The Mind~</p>

        <button id="generateQuote">New Quote</button>


    </header>


    <main>

        <section id="right">

            <h1>”</h1>
            <blockquote id="quote">~Find The Other Side~</blockquote>
            <p id="author">- Your Choice</p>

            <div id="musicBox">

                <button id="musicButton">▶</button>

                <audio id="musicBackground" loop preload="auto">
                    <source src="I Have No Enemies.mp3" type="audio/mpeg">
                    Your browser does not support audio.
                </audio>

            </div>


            <p id="message"></p>

        </section>

    </main>






    <script src="script.js"></script>
</body>

</html>
